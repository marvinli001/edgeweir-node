name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Both jobs publish; check the IPinfo token first so a missing secret stops
  # the release before anything is published (release images bundle IPinfo Lite).
  preflight:
    name: release secrets
    runs-on: ubuntu-latest
    steps:
      - name: require the IPinfo token
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          if [ -z "$IPINFO_TOKEN" ]; then
            echo "::error::Set the IPINFO_TOKEN repository secret: release images bundle the IPinfo Lite database"
            exit 1
          fi

  # edgeweir-openresty and edgeweir-openresty-modsecurity, built natively
  # per architecture (a C/C++ build under QEMU takes hours) and released
  # next to edgeweir-node through checksums.txt.
  openresty:
    name: edgeweir-openresty (${{ matrix.arch }})
    needs: preflight
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.52.0
      - run: make openresty-packages ARCH=${{ matrix.arch }} OPENRESTY_JOBS=4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openresty-${{ matrix.arch }}
          path: |
            out/openresty/*.deb
            out/openresty/*.rpm
            out/openresty/*.sbom.json
          if-no-files-found: error
          retention-days: 7

  goreleaser:
    name: binaries, packages, SBOMs, signatures, provenance
    needs: [preflight, openresty]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # cosign keyless signing (Sigstore Fulcio OIDC)
      attestations: write # SLSA build provenance (GitHub artifact attestations)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never restore build caches into a release build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: openresty-*
          path: out/openresty
          merge-multiple: true
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.52.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA v1 build provenance for every file listed in checksums.txt
      # (archives, deb/rpm packages, SBOMs); verify with
      # `gh attestation verify <file> --repo marvinli001/edgeweir-node`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

  # The node image builds edgeweir-openresty itself: each architecture is
  # built natively and pushed by digest, then one manifest list gets the
  # tags, the signature and the provenance.
  image:
    name: container image (${{ matrix.platform }})
    needs: preflight
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/marvinli001/edgeweir-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build metadata
        id: meta
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "date=$(git log -1 --format=%cI)"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "arch=${PLATFORM#linux/}"
          } >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: tags
        with:
          images: ${{ env.IMAGE }}
          # Overrides the repository licence the action derives ("AGPL-3.0"):
          # release images also carry the IPinfo Lite data.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only AND CC-BY-SA-4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.tags.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
            IPINFO_REQUIRED=1
            OPENRESTY_JOBS=4
          # A secret mount, not a build arg: mode=max provenance records build args.
          secrets: |
            ipinfo_token=${{ secrets.IPINFO_TOKEN }}
      - name: export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.meta.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: container image (ghcr.io/marvinli001/edgeweir-node)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/marvinli001/edgeweir-node
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: tags
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: create the manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$METADATA") \
            $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          METADATA: ${{ steps.tags.outputs.json }}
          VERSION: ${{ steps.tags.outputs.version }}
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: sign image (cosign keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
