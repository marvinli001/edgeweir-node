# Container smoke test: fake console + edgeweir-node + whoami origins.
# Run with `make e2e` (test/e2e/run.sh). The real end-to-end test with the
# console lives in the edgeweir repository (compose.e2e.yml).
#
# The fake console allows origins on its own network (default), which the
# node and whoami share. "hidden" sits only on the isolated network that
# the node also joins: its DNS answer is a private address outside the
# allow list, so the node must refuse it.
name: edgeweir-node-e2e

services:
  console:
    build:
      context: ../..
      dockerfile: test/e2e/fakeconsole/Dockerfile
    ports:
      - "127.0.0.1:${E2E_HELPER_PORT:-28090}:8081"
    volumes:
      - origin-ca:/shared
    # The node's nginx.conf references the HTTPS origin's CA: start the
    # node only once the console has written it.
    healthcheck:
      test: ["CMD", "test", "-s", "/shared/origin-ca.pem"]
      interval: 1s
      retries: 30
    networks: [default]

  whoami:
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    networks: [default]

  hidden:
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    networks: [isolated]

  node:
    build:
      context: ../..
    image: edgeweir-node:e2e-smoke
    depends_on:
      console:
        condition: service_healthy
      whoami:
        condition: service_started
      hidden:
        condition: service_started
    environment:
      # Trust store for HTTPS origins (instead of the system bundle).
      EDGEWEIR_TRUSTED_CA: /etc/edgeweir-e2e/origin-ca.pem
    ports:
      - "127.0.0.1:${E2E_NODE_PORT:-28080}:80"
      - "127.0.0.1:${E2E_PP_PORT:-28081}:8081"
    volumes:
      - node-state:/var/lib/edgeweir-node
      - origin-ca:/etc/edgeweir-e2e:ro
    networks: [default, isolated]

networks:
  default:
  isolated:

volumes:
  node-state:
  origin-ca:
