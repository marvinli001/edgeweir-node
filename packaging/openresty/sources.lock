# Pinned sources of the edgeweir-openresty build (fetch.sh reads this file).
#
#   name  version  sha256  url  [signature-url  key-file  primary-key-fingerprint]
#
# fetch.sh downloads every url into /build/dl, checks its SHA-256 and, when a
# signature is given, verifies it with gpgv against keys/<key-file> only,
# requiring the signing key's primary fingerprint to be the one pinned here.
# Key sources: OpenResty (openresty.org download page, key A0E98066),
# OpenSSL (doc/fingerprints.txt), PCRE2 (SECURITY.md), zlib (the author's
# key page linked from zlib.net), Zstandard (release signing key of the
# GitHub releases, signing@zstd.net), ModSecurity and ModSecurity-nginx
# (OWASP ModSecurity release key, also pinned by Fedora and Arch Linux),
# OWASP CRS (SECURITY.md). Sources without upstream signatures (GitHub tag
# archives, libxml2) rely on the SHA-256 alone; libxml2's matches the
# .sha256sum GNOME publishes.
#
# epoch is SOURCE_DATE_EPOCH for every timestamp of the build and the
# packages (2026-10-01T00:00:00Z). The package release is in
# nfpm/edgeweir-openresty.yaml: back to 1 with a new OpenResty version,
# raised when anything else here changes.
